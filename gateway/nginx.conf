limit_req_zone $server_name zone=jejak_api:1m rate=10r/s;

upstream jejak_core {
    zone jejak_core 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server core-service:8000 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location / {
        limit_req zone=jejak_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://jejak_core;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
