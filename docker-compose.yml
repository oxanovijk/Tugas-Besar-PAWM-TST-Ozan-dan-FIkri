services:
  core-service:
    build: ./core-service
    volumes:
      - catalog-data:/var/lib/jejaknusantara
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      core-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JEJAK_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - gateway
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

volumes:
  catalog-data:
